name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: fmt
        run: cargo fmt -- --check
      # Les deux coques Tauri sont exclues ici : `tauri::generate_context!` lit
      # le frontend compilé (`apps/*/dist`), que ce job ne construit pas — la
      # macro panique alors avec un message qui ne parle pas de Rust. C'est le
      # job JS, qui a déjà Node et pnpm, qui les compile après avoir bâti les
      # interfaces.
      - name: clippy
        run: cargo clippy --workspace --all-targets --exclude locaryn-desktop --exclude locaryn-mobile -- -D warnings
      - name: test
        run: cargo test --workspace --exclude locaryn-desktop --exclude locaryn-mobile
      - name: cargo-deny
        if: runner.os == 'Linux'
        run: |
          # Version majeure figée : cargo-deny change le schéma de deny.toml
          # entre majeures, et une installation « dernière version » a déjà
          # fait échouer la CI sur sa propre configuration, sans qu'aucune
          # dépendance n'ait bougé.
          cargo install cargo-deny --locked --version "^0.20"
          cargo deny check

  js:
    name: JS / TS
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # Pas de `version:` ici : `packageManager` dans package.json fait foi,
      # et pnpm refuse de demarrer quand les deux se contredisent.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Dans cet ordre : les coques Tauri intègrent le frontend au moment de la
      # compilation. Compiler l'une sans avoir bâti l'autre échoue sur une
      # panique de macro, pas sur une erreur Rust lisible.
      - name: Construire les interfaces
        run: |
          pnpm --dir apps/desktop build
          pnpm --dir apps/mobile build
      # L'application embarque le service et la CLI : Tauri vérifie leur
      # présence dès la compilation. Le même script qu'à la release, en debug —
      # il s'agit ici de constater que l'ensemble tient debout, pas de produire
      # un paquet.
      - name: Préparer les compagnons de l'application
        env:
          PROFILE: debug
        run: bash scripts/stage-desktop-sidecars.sh
      # `cargo test` plutôt que `cargo check` : les deux coques sont exclues du
      # travail Rust (elles ont besoin des interfaces compilées), donc leurs
      # tests ne tournaient nulle part. C'est ici, et seulement ici, que le
      # garde-fou « la configuration déclare une fenêtre » peut s'exécuter.
      - name: Compiler et tester les coques Tauri
        run: cargo test -p locaryn-desktop -p locaryn-mobile

name: Release

# Two products, deliberately separate:
#
#   * locaryn-server — headless. Meant for a machine with a GPU and no desktop
#     session, so it must not drag in WebKit or a window toolkit.
#   * locaryn — the desktop application, which can also serve.
#
# Both ship as an installer and as a portable archive, because a locked-down
# workstation often cannot run an installer at all.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (leave empty for a draft from the current commit)"
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Headless server: daemon + CLI, no GUI toolchain ────────────────────
  server:
    name: Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83
      - uses: Swatinem/rust-cache@v2

      - name: Build server binaries
        run: cargo build --release --target ${{ matrix.target }} -p locaryn-daemon -p locaryn-cli

      # ── Portable archive ───────────────────────────────────────────────
      - name: Package portable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/locaryn-server-portable"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/locaryn-daemon.exe" $out
          Copy-Item "target/${{ matrix.target }}/release/locaryn.exe" $out
          Copy-Item "README.md","LICENSE*" $out -EA SilentlyContinue
          Compress-Archive -Path "$out/*" -DestinationPath "dist/locaryn-server-windows-x64.zip" -Force

      - name: Package portable (Linux)
        if: runner.os == 'Linux'
        run: |
          out=dist/locaryn-server-portable
          mkdir -p "$out"
          cp target/${{ matrix.target }}/release/locaryn-daemon "$out/"
          cp target/${{ matrix.target }}/release/locaryn "$out/"
          cp README.md "$out/" 2>/dev/null || true
          tar -C "$out" -czf dist/locaryn-server-linux-x64.tar.gz .

      # ── Installers ─────────────────────────────────────────────────────
      - name: Build .msi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install cargo-wix --locked
          # Initialise the WiX definition on first run; committed afterwards so
          # the installer layout stays reviewable rather than regenerated.
          if (-not (Test-Path "services/daemon/wix/main.wxs")) {
            cargo wix init --package locaryn-daemon --force
          }
          cargo wix --package locaryn-daemon --nocapture --output dist/locaryn-server-windows-x64.msi

      - name: Build .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p locaryn-daemon --target ${{ matrix.target }} --output dist/locaryn-server-linux-x64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ── Desktop application (GUI, and can serve) ───────────────────────────
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile
      - name: Build the app
        run: pnpm --dir apps/desktop tauri build

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          # Tauri's output layout differs per platform; take whatever it made.
          find target/release/bundle -type f \
            \( -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \) \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/

      - name: Package portable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/locaryn-portable"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "target/release/Locaryn.exe" $out
          Copy-Item "target/release/locaryn.exe" $out -EA SilentlyContinue
          Compress-Archive -Path "$out/*" -DestinationPath "dist/locaryn-desktop-windows-x64.zip" -Force

      - name: Package portable (Linux)
        if: runner.os == 'Linux'
        run: |
          out=dist/locaryn-portable
          mkdir -p "$out"
          cp target/release/locaryn-desktop "$out/" 2>/dev/null || cp target/release/Locaryn "$out/" 2>/dev/null || true
          tar -C "$out" -czf dist/locaryn-desktop-linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*
          if-no-files-found: warn

  # ── Android client ─────────────────────────────────────────────────────
  # Only builds once apps/mobile exists; skipped cleanly until then so a
  # release is not blocked by an app that has not been written yet.
  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Is there a mobile app yet?
        id: check
        run: |
          if [ -d apps/mobile ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "apps/mobile absent — étape ignorée"; fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.present == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Build APK
        if: steps.check.outputs.present == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/mobile build:apk
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.present == 'true'
        with:
          name: android-apk
          path: apps/mobile/**/*.apk
          if-no-files-found: error

  # ── Draft release ──────────────────────────────────────────────────────
  publish:
    name: Draft release
    needs: [server, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft, never publish automatically
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
          generate_release_notes: true

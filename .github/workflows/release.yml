name: Release

# Trois produits, délibérément séparés :
#
#   * locaryn-server — sans interface. Destiné à une machine avec un GPU et
#     aucune session graphique : il ne doit donc entraîner ni WebKit ni boîte
#     à outils de fenêtrage.
#   * locaryn — l'application de bureau, qui sait aussi servir.
#   * l'APK Android — le client mobile.
#
# Bureau et serveur sortent en installeur *et* en archive portable : un poste
# verrouillé ne peut souvent pas lancer un installeur du tout.
#
# Couverture assumée : Windows x64, Linux x64, macOS universel (Intel +
# Apple Silicon), Android. Linux ARM64 et Windows ARM64 sont absents faute de
# runners ARM — mieux vaut ne pas les annoncer que livrer des binaires jamais
# construits.
#
# Mise à jour automatique : le bureau embarque le plugin updater Tauri, qui
# interroge `latest.json` publié sur chaque release (généré dans le job
# « Publication de la release »). Pour que cela marche, la release doit être
# PUBLIÉE (pas un brouillon), les installeurs consommés par l'updater doivent
# garder les noms Tauri (`Locaryn_<version>_x64.msi`, le .app.tar.gz
# macOS, …), et chaque installeur doit être accompagné de son `.sig` — d'où
# la signature obligatoire via le secret
# `TAURI_SIGNING_PRIVATE_KEY` et `createUpdaterArtifacts` dans tauri.conf.json.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à construire (vide = brouillon depuis le commit courant)"
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Serveur sans interface : démon + CLI, aucune chaîne graphique ───────
  server:
    name: Serveur (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            label: macos-x64
    steps:
      - uses: actions/checkout@v4
      # Pas de `targets:` ici : le rust-toolchain.toml du dépôt écrase
      # l'action (toolchain nommée d'après le host, ex. 1.88-aarch64 sur
      # runner arm64) et le --target de l'action est perdu. On installe la
      # cible explicitement sur la toolchain réellement active, comme le fait
      # déjà le job bureau pour macOS.
      - uses: dtolnay/rust-toolchain@1.88
      - name: Ajouter la cible de compilation
        run: rustup target add ${{ matrix.target }}
      # Le trousseau système passe par dbus sous Linux (keyring →
      # dbus-secret-service → libdbus-sys), dont le build.rs abandonne si
      # pkg-config ne trouve pas la bibliothèque. Tant qu'un cache tiède la
      # fournissait, le manque restait invisible.
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Version lisible pour les noms de fichiers : la release porte le tag
      # `v0.1.0`, les artefacts s'appellent `locaryn-0.1.0-…`.
      - name: Déterminer la version
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [ -n "$ver" ] || ver="0.1.0"
          echo "VER=$ver" >> "$GITHUB_ENV"

      - name: Construire les binaires du serveur
        run: cargo build --release --target ${{ matrix.target }} -p locaryn-daemon -p locaryn-cli

      # ── Archive portable ───────────────────────────────────────────────
      - name: Archive portable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/locaryn-server-portable"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/locaryn-daemon.exe" $out
          Copy-Item "target/${{ matrix.target }}/release/locaryn.exe" $out
          Copy-Item "README.md","LICENSE*" $out -EA SilentlyContinue
          Compress-Archive -Path "$out/*" -DestinationPath "dist/locaryn-$env:VER-server-${{ matrix.label }}.zip" -Force
          # Le dossier portable est déjà archivé dans le .zip : on le retire,
          # sinon ses binaires bruts (locaryn-daemon.exe, locaryn.exe) se
          # retrouvent en doublon dans l'artefact puis dans la release.
          Remove-Item $out -Recurse -Force

      - name: Archive portable (Unix)
        if: runner.os != 'Windows'
        run: |
          out=dist/locaryn-server-portable
          mkdir -p "$out"
          cp target/${{ matrix.target }}/release/locaryn-daemon "$out/"
          cp target/${{ matrix.target }}/release/locaryn "$out/"
          cp README.md LICENSE* "$out/" 2>/dev/null || true
          tar -C "$out" -czf "dist/locaryn-${VER}-server-${{ matrix.label }}.tar.gz" .
          # Idem : retiré après archivage, sinon les binaires bruts (locaryn,
          # locaryn-daemon) sont publiés en double dans la release.
          rm -rf "$out"

      # ── Installeurs ────────────────────────────────────────────────────
      # macOS n'en reçoit pas : signer et notariser exige un compte Apple
      # Developer et des secrets que ce dépôt n'a pas. Une archive honnête
      # vaut mieux qu'un .pkg que Gatekeeper refusera d'ouvrir.
      - name: Installeur .msi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Le link (light) résout `wix\License.rtf` (généré par init, référence
        # WixUILicenseRtf + composant sidecar) relativement au CWD : on tourne
        # depuis le package pour que le fichier soit trouvé.
        working-directory: services/daemon
        run: |
          cargo install cargo-wix --locked
          # La définition WiX est initialisée au premier passage, puis
          # committée : la structure de l'installeur reste relisible plutôt
          # que régénérée à chaque build.
          if (-not (Test-Path "wix/main.wxs")) {
            cargo wix init --package locaryn-daemon --force
          }
          # cargo-wix recompile pour la cible par défaut : ses fichiers
          # atterrissent dans `target\release`, pas dans le dossier de la
          # cible explicite utilisée par l'étape de compilation. La CLI, elle,
          # n'est pas reconstruite par cargo-wix — on la dépose donc là où le
          # main.wxs la cherche, sinon `light` échoue avec un fichier absent.
          New-Item -ItemType Directory -Force ../../target/release | Out-Null
          Copy-Item "../../target/${{ matrix.target }}/release/locaryn.exe" "../../target/release/" -Force
          cargo wix --package locaryn-daemon --nocapture --output "dist/locaryn-$env:VER-server-windows-x64.msi"
          # L'upload d'artefacts se fait depuis la racine du dépôt : on
          # ramène le .msi dans dist/ à la racine.
          New-Item -ItemType Directory -Force ../../dist | Out-Null
          Move-Item "dist/locaryn-$env:VER-server-windows-x64.msi" "../../dist/" -Force

      - name: Paquet .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          # `--no-build` : les deux binaires sont déjà compilés par l'étape
          # précédente, pour la même cible. Laisser cargo-deb relancer sa propre
          # compilation lui faisait reprendre l'arbre entier — et échouer sur
          # libdbus-sys, dépendance Linux du trousseau, dont le build.rs abandonne
          # quand pkg-config ne trouve pas dbus.
          cargo deb -p locaryn-daemon --no-build --target ${{ matrix.target }} --output "dist/locaryn-${VER}-server-linux-x64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # ── Application de bureau (interface, et sait servir) ──────────────────
  desktop:
    name: Bureau (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x64
            args: ""
          - os: ubuntu-22.04
            label: linux-x64
            args: ""
          # Un seul artefact macOS qui tourne sur les deux architectures :
          # plus simple à publier, et personne n'a à deviner sa puce.
          - os: macos-14
            label: macos-universal
            args: "--target universal-apple-darwin"
    env:
      # Clé de signature de l'updater. Sans elle, `tauri build` refuse de
      # produire des installeurs non signés quand l'updater est activé.
      # La clé privée vit dans un secret GitHub, jamais dans le dépôt.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - name: Cibles macOS pour le binaire universel
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.label }}
      # Pas de `version:` ici : `packageManager` dans package.json fait foi,
      # et pnpm refuse de demarrer quand les deux se contredisent.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Dépendances Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Déterminer la version
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [ -n "$ver" ] || ver="0.1.0"
          echo "VER=$ver" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # L'application sait devenir un serveur partagé : la case à cocher
      # démarre `locaryn-daemon` posé à côté de son exécutable (server_mode.rs).
      # Encore faut-il qu'il y soit — aucun paquet bureau ne l'embarquait, et la
      # fonction ne pouvait qu'afficher « service introuvable ». Les deux
      # binaires voyagent donc avec l'application, ce qui donne du même coup la
      # commande `locaryn` sur la machine.
      - name: Embarquer le service et la CLI dans l'application
        shell: bash
        env:
          UNIVERSAL: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: bash scripts/stage-desktop-sidecars.sh

      - name: Construire l'application
        run: pnpm --dir apps/desktop tauri build ${{ matrix.args }}

      - name: Rassembler les installeurs
        shell: bash
        run: |
          mkdir -p dist
          # La disposition de sortie de Tauri diffère par plateforme, et la
          # cible universelle range ailleurs : on ratisse les deux racines.
          # Les `.sig` sont les signatures que l'updater télécharge à côté
          # de l'installeur — sans elles, la mise à jour est refusée.
          for root in target/release/bundle target/universal-apple-darwin/release/bundle; do
            [ -d "$root" ] || continue
            find "$root" -type f \
              \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' \
                 -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.app.tar.gz' \
                 -o -name '*.sig' \) \
              -exec cp {} dist/ \; 2>/dev/null || true
          done
          # Nettoyage des doublons : pour Windows Bureau, seul l'installeur moderne NSIS
          # (.exe-setup) est conservé. Le .msi bureau et les .rpm sont supprimés pour éviter
          # toute confusion avec le .msi serveur.
          rm -f dist/*_en-US.msi dist/*_en-US.msi.sig dist/*_x64.msi dist/*_x64.msi.sig dist/*.rpm dist/*.rpm.sig
          # Les signatures Linux ne servent à personne : l'écran « À propos »
          # désactive l'updater sur Linux (AboutSettings.tsx), et le manifeste
          # ne déclare donc aucune plateforme linux-*. Publier ces .sig laissait
          # croire à une mise à jour automatique qui n'existe pas. Retirer cette
          # ligne le jour où l'updater couvrira l'AppImage.
          rm -f dist/*.deb.sig dist/*.AppImage.sig
          ls -la dist/
          # Un job qui « réussit » sans rien produire est un piège : il fait
          # croire à une release complète.
          [ -n "$(ls -A dist/ 2>/dev/null)" ] || { echo "::error::aucun installeur produit pour ${{ matrix.label }}"; exit 1; }

      - name: Archive portable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/locaryn-portable"
          New-Item -ItemType Directory -Force $out | Out-Null
          # Le nom de la crate, et lui seul : Tauri ne renomme au nom du produit
          # que dans ses paquets. Chercher « Locaryn.exe » ici serait un piège
          # sur Windows, où le système ne distingue pas les majuscules — le
          # fichier trouvé serait la CLI (`locaryn.exe`), empaquetée sous le nom
          # de l'application.
          $exe = "target/release/locaryn-desktop.exe"
          if (-not (Test-Path $exe)) { throw "aucun exécutable de bureau trouvé dans target/release" }
          Copy-Item $exe $out
          # Les mêmes compagnons que dans l'installeur : sans eux, le mode
          # serveur de la version portable n'aurait rien à démarrer.
          Copy-Item "apps/desktop/src-tauri/binaries/locaryn-daemon-x86_64-pc-windows-msvc.exe" "$out/locaryn-daemon.exe"
          Copy-Item "apps/desktop/src-tauri/binaries/locaryn-x86_64-pc-windows-msvc.exe" "$out/locaryn.exe"
          Compress-Archive -Path "$out/*" -DestinationPath "dist/locaryn-$env:VER-desktop-windows-x64-portable.zip" -Force
          Remove-Item $out -Recurse -Force

      - name: Archive portable (Linux)
        if: runner.os == 'Linux'
        run: |
          out=dist/locaryn-portable
          mkdir -p "$out"
          if [ ! -f target/release/locaryn-desktop ]; then
            echo "::error::aucun exécutable de bureau trouvé dans target/release"
            exit 1
          fi
          cp target/release/locaryn-desktop "$out/"
          # Mêmes compagnons que dans le .deb et l'AppImage.
          triple=$(rustc -vV | sed -n 's/^host: //p')
          cp "apps/desktop/src-tauri/binaries/locaryn-daemon-$triple" "$out/locaryn-daemon"
          cp "apps/desktop/src-tauri/binaries/locaryn-$triple" "$out/locaryn"
          tar -C "$out" -czf "dist/locaryn-${VER}-desktop-linux-x64-portable.tar.gz" .
          rm -rf "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # ── Client Android ─────────────────────────────────────────────────────
  android:
    name: APK Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Installer le NDK
        run: |
          sdkmanager --install "ndk;26.3.11579264" "platform-tools" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
      # Même raison que le job serveur : le rust-toolchain.toml du dépôt
      # écrase l'action (toolchain nommée d'après le host), donc les cibles
      # Android sont installées explicitement sur la toolchain active.
      - uses: dtolnay/rust-toolchain@1.88
      - name: Ajouter les cibles Android
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # La tâche Gradle du plugin Tauri invoque `cargo tauri android
      # android-studio-script` : il lui faut un binaire `cargo-tauri` sur le
      # PATH. On pointe vers le CLI déjà installé par pnpm (binaire
      # précompilé, même version que le package.json) plutôt que de
      # recompiler tauri-cli depuis les sources. Le wrapper passe par `node`
      # pour que tauri.js garde son chemin d'invocation normal.
      #
      # Subtilité : cargo préfixe le nom de la sous-commande aux arguments
      # (`cargo tauri x` exécute `cargo-tauri tauri x`), d'après le source
      # de cargo (cli.rs, branche External). Le vrai cargo-tauri Rust le
      # tolère ; le CLI JS non. On élague donc un premier argument `tauri`.
      - name: Exposer le CLI Tauri comme sous-commande cargo
        run: |
          mkdir -p "$HOME/.cargo/bin"
          printf '#!/bin/sh\nif [ "$1" = "tauri" ]; then shift; fi\nexec node "%s/apps/mobile/node_modules/@tauri-apps/cli/tauri.js" "$@"\n' "$GITHUB_WORKSPACE" > "$HOME/.cargo/bin/cargo-tauri"
          chmod +x "$HOME/.cargo/bin/cargo-tauri"
          "$HOME/.cargo/bin/cargo-tauri" --version
      - name: Construire l'APK
        run: pnpm --dir apps/mobile build:apk

      - name: Déterminer la version
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [ -n "$ver" ] || ver="0.1.0"
          echo "VER=$ver" >> "$GITHUB_ENV"

      # La clé de signature décide de l'identité de l'application pour toutes
      # ses mises à jour à venir : elle appartient au propriétaire du projet,
      # pas à la CI. On signe donc si — et seulement si — le dépôt fournit un
      # keystore en secret. Sinon l'APK sort non signé, et son nom le dit :
      # Android refuse d'installer un paquet sans signature, un fichier appelé
      # « locaryn-x.y.z-android.apk » laissait croire le contraire.
      #
      # Pour activer la signature, définir les secrets ANDROID_KEYSTORE_BASE64
      # (base64 d'un .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS et
      # ANDROID_KEY_PASSWORD.
      - name: Rassembler l'APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          apk=$(find apps/mobile/src-tauri/gen/android -name '*.apk' -path '*release*' | head -1)
          [ -n "$apk" ] || { echo "::error::aucun APK produit"; exit 1; }
          # Nom aligné sur les autres artefacts : locaryn-<version>-<produit>-<plateforme>.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            tools=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            "$tools/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign \
              --ks "$RUNNER_TEMP/keystore.jks" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "dist/locaryn-${VER}-android.apk" \
              "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" verify --print-certs "dist/locaryn-${VER}-android.apk"
            rm -f "$RUNNER_TEMP/keystore.jks" "$RUNNER_TEMP/aligned.apk"
          else
            echo "::warning::aucun keystore configuré — l'APK est publié non signé et ne pourra pas être installé tel quel"
            cp "$apk" "dist/locaryn-${VER}-android-unsigned.apk"
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error

  # ── Release ────────────────────────────────────────────────────────────
  publish:
    name: Publication de la release
    # L'Android est dans les dépendances : sans lui, la release partait
    # systématiquement sans le client mobile.
    needs: [server, desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Déterminer la version
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [ -n "$ver" ] || ver="0.1.0"
          echo "VER=$ver" >> "$GITHUB_ENV"

      # Un tag reposé après correction relance ce workflow sur une release qui
      # existe déjà. L'action de publication remplace les fichiers de même nom
      # mais laisse les autres : la v0.2.0 s'est ainsi retrouvée avec le .msi
      # d'un build et le setup.exe d'un autre — deux compilations différentes
      # de la même version — plus un .rpm.sig sans .rpm. On repart d'une
      # release vide pour que la liste publiée soit exactement celle produite
      # par cette exécution.
      - name: Retirer les assets d'une publication précédente
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          anciens=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null || true)
          [ -n "$anciens" ] || { echo "aucune publication précédente pour $GITHUB_REF_NAME"; exit 0; }
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            echo "suppression de l'asset obsolète : $asset"
            gh release delete-asset "$GITHUB_REF_NAME" "$asset" \
              --repo "$GITHUB_REPOSITORY" --yes
          done <<< "$anciens"

      # Nom réel de l'APK : il dépend de la présence d'un keystore (voir le job
      # Android). Le tableau de la note de release doit désigner le fichier
      # effectivement publié, et dire quand il n'est pas installable.
      - name: Repérer l'APK publié
        shell: bash
        run: |
          apk=$(find artifacts -name 'locaryn-*-android*.apk' -printf '%f\n' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::aucun APK dans les artefacts"; exit 1
          fi
          echo "APK=$apk" >> "$GITHUB_ENV"
          case "$apk" in
            *-unsigned.apk)
              echo "APK_NOTE=**non signé** : Android refusera de l'installer tel quel (voir plus bas)" >> "$GITHUB_ENV" ;;
            *)
              echo "APK_NOTE=client mobile Android" >> "$GITHUB_ENV" ;;
          esac

      # Manifeste de mise à jour du bureau. Le plugin updater v2 ne sait pas
      # lire l'API des releases GitHub : il attend un JSON au format
      # « static » (version + plateformes → url + signature). Il est généré à
      # partir des .sig produits par tauri build (createUpdaterArtifacts) puis
      # publié comme asset — l'endpoint configuré dans tauri.conf.json pointe
      # dessus. Si un .sig manque, le build échoue au lieu de sortir une
      # release dont l'auto-update est muette.
      - name: Générer le manifeste de mise à jour (latest.json)
        shell: bash
        run: |
          python3 - "$VER" <<'PY'
          import glob
          import json
          import os
          import sys
          from datetime import datetime, timezone

          ver = sys.argv[1]
          base = f"https://github.com/Locaryn/locaryn/releases/download/v{ver}"
          platforms = {}

          def sig(path):
              with open(path, encoding="utf-8") as f:
                  return f.read().strip()

          # Windows x64 — l'updater pointe sur l'installeur moderne NSIS
          hit = glob.glob(f"artifacts/desktop-windows-x64/Locaryn_{ver}_x64-setup.exe.sig") or glob.glob(f"artifacts/desktop-windows-x64/Locaryn_{ver}_x64.msi.sig")
          if hit:
              asset = os.path.basename(hit[0])[:-4]
              platforms["windows-x86_64"] = {
                  "url": f"{base}/{asset}",
                  "signature": sig(hit[0]),
              }

          # macOS — un seul bundle universel (Intel + Apple Silicon), servi
          # sous les deux architectures demandées par le client.
          hit = glob.glob("artifacts/desktop-macos-universal/*.app.tar.gz.sig")
          if hit:
              asset = os.path.basename(hit[0])[:-4]  # retire le suffixe .sig
              for arch in ("darwin-x86_64", "darwin-aarch64"):
                  platforms[arch] = {
                      "url": f"{base}/{asset}",
                      "signature": sig(hit[0]),
                  }

          if not platforms:
              raise SystemExit("::error::aucune signature .sig trouvée — createUpdaterArtifacts est-il activé ?")

          manifest = {
              "version": ver,
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("artifacts/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      # Publiée, pas en brouillon : la mise à jour automatique du bureau et
      # le téléchargement public passent par l'API « latest release » de
      # GitHub, qui ignore les brouillons.
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: "Locaryn v${{ env.VER }}"
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ### Choisir son fichier

            La règle est simple : prenez le fichier **de votre plateforme**, de préférence
            l'**installeur** (il s'occupe de tout, et il se met à jour tout seul ensuite).
            L'archive portable se télécharge et se dézippe n'importe où, mais elle ne
            reçoit pas les mises à jour automatiques.

            #### Application de bureau (interface)

            | Plateforme | Fichier | Notes |
            |---|---|---|
            | Windows x64 | `Locaryn_${{ env.VER }}_x64-setup.exe` | installeur moderne NSIS (gestion automatique des dossiers) |
            | Windows x64 | `locaryn-${{ env.VER }}-desktop-windows-x64-portable.zip` | portable, sans auto-update |
            | macOS | `Locaryn_${{ env.VER }}_universal.dmg` | universel, Intel et Apple Silicon |
            | Linux x64 | `Locaryn_${{ env.VER }}_amd64.deb` | Debian / Ubuntu |
            | Linux x64 | `Locaryn_${{ env.VER }}_amd64.AppImage` | portable, sans installation |
            | Linux x64 | `locaryn-${{ env.VER }}-desktop-linux-x64-portable.tar.gz` | portable, sans auto-update |
            | Android | `${{ env.APK }}` | ${{ env.APK_NOTE }} |

            L'application de bureau emporte le service Locaryn et la commande `locaryn` :
            elle peut donc servir d'autres appareils du réseau local (Réglages → Serveur) et se
            piloter depuis un terminal, sans rien installer d'autre. Sous Linux la commande est
            posée dans `/usr/bin` ; ailleurs elle se trouve à côté de l'application.

            #### Serveur (sans interface)

            `locaryn-daemon` + CLI `locaryn` — pour une machine dédiée, sans session graphique.
            Sur Debian/Ubuntu, ce paquet et celui de l'application de bureau ne s'installent pas
            ensemble : le second contient déjà le premier.

            | Plateforme | Fichier | Notes |
            |---|---|---|
            | Windows x64 | `locaryn-${{ env.VER }}-server-windows-x64.msi` | installe le démon **et** la CLI, et les ajoute au PATH — installation pour tous les utilisateurs, donc à lancer en administrateur |
            | Windows x64 | `locaryn-${{ env.VER }}-server-windows-x64.zip` | portable, sans auto-update |
            | Linux x64 | `locaryn-${{ env.VER }}-server-linux-x64.deb` | Debian / Ubuntu |
            | Linux x64 | `locaryn-${{ env.VER }}-server-linux-x64.tar.gz` | portable, sans auto-update |
            | macOS Intel | `locaryn-${{ env.VER }}-server-macos-x64.tar.gz` | portable |
            | macOS Apple Silicon | `locaryn-${{ env.VER }}-server-macos-arm64.tar.gz` | portable |

            ### Mises à jour

            Windows et macOS se mettent à jour tout seuls (bouton « Vérifier les mises à jour »
            dans Réglages → À propos) : l'updater télécharge `Locaryn_${{ env.VER }}_x64-setup.exe`
            ou `Locaryn.app.tar.gz` et vérifie leur signature avant de les installer. Sous Linux,
            l'auto-update est désactivée — téléchargez le nouveau `.deb` / `.AppImage` depuis
            cette page.

            Cette signature est celle de l'updater, pas une signature d'éditeur : les binaires
            Windows ne sont **pas signés Authenticode** (SmartScreen affichera un avertissement)
            et les binaires macOS ne sont **pas notarisés** (première ouverture : clic droit →
            Ouvrir).

            ### Android

            L'APK n'est signé que si le dépôt fournit un keystore. Publié `-unsigned`, il ne
            s'installe pas tel quel : signez-le avec votre propre clé
            (`apksigner sign --ks votre.jks --out locaryn.apk locaryn-…-android-unsigned.apk`)
            avant de l'installer. La clé de signature fixe l'identité de l'application pour
            toutes ses mises à jour : elle appartient au propriétaire du projet, pas à la CI.

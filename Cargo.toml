[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/desktop/src-tauri",
    "apps/mobile/src-tauri",
    "services/daemon",
    "services/remote-server",
    "services/provider-supervisor",
    "packages/shared-types",
    "packages/sdk",
    "packages/auth",
    "packages/config",
    "packages/media",
    "packages/storage",
    "packages/events",
    "packages/preview",
    "packages/extensions",
    "packages/mcp",
    "packages/travel",
    "packages/plugin-sdk",
    "packages/command-runtime",
    "packages/hook-runtime",
    "packages/skill-runtime",
    "packages/agent-runtime",
    "packages/core-bridge",
    "packages/rules-runtime",
    "packages/lsp-adapters",
    "packages/ssh",
]

[workspace.package]
version = "0.3.43"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Locaryn/locaryn"
homepage = "https://locaryn.dev"
authors = ["Locaryn Contributors"]

[workspace.dependencies]
# Internal crates — version pinned to workspace
locaryn-shared-types      = { path = "packages/shared-types", version = "0.3.21" }
locaryn-sdk               = { path = "packages/sdk", version = "0.3.21" }
locaryn-auth              = { path = "packages/auth", version = "0.3.21" }
locaryn-config            = { path = "packages/config", version = "0.3.21" }
locaryn-media             = { path = "packages/media", version = "0.3.21" }
locaryn-storage           = { path = "packages/storage", version = "0.3.21" }
locaryn-events            = { path = "packages/events", version = "0.3.21" }
locaryn-preview           = { path = "packages/preview", version = "0.3.21" }
locaryn-extensions        = { path = "packages/extensions", version = "0.3.21" }
locaryn-mcp               = { path = "packages/mcp", version = "0.3.21" }
locaryn-travel            = { path = "packages/travel", version = "0.3.21" }
locaryn-plugin-sdk        = { path = "packages/plugin-sdk", version = "0.3.21" }
locaryn-command-runtime   = { path = "packages/command-runtime", version = "0.3.21" }
locaryn-hook-runtime      = { path = "packages/hook-runtime", version = "0.3.21" }
locaryn-skill-runtime     = { path = "packages/skill-runtime", version = "0.3.21" }
locaryn-agent-runtime     = { path = "packages/agent-runtime", version = "0.3.21" }
locaryn-core-bridge       = { path = "packages/core-bridge", version = "0.3.21" }
locaryn-rules-runtime     = { path = "packages/rules-runtime", version = "0.3.21" }
locaryn-lsp-adapters      = { path = "packages/lsp-adapters", version = "0.3.21" }
locaryn-ssh               = { path = "packages/ssh", version = "0.3.21" }
locaryn-provider-supervisor = { path = "services/provider-supervisor", version = "0.3.21" }

# External crates — pinned once for the workspace
tokio       = { version = "1.41", features = ["full"] }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
async-trait = "0.1"
thiserror   = "2.0"
anyhow      = "1.0"
argon2      = "0.5"
rand        = "0.8"
subtle      = "2.6"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum        = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen       = { version = "0.13", features = ["x509-parser"] }
igd-next    = { version = "0.17", features = ["aio_tokio"] }
rustls      = { version = "0.23", default-features = false, features = ["ring"] }
reqwest     = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
sqlx        = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "macros", "migrate", "chrono"] }
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1.11", features = ["v4", "serde"] }
clap        = { version = "4.5", features = ["derive", "env"] }
futures     = "0.3"
bytes       = "1.9"
parking_lot = "0.12"
tokio-util  = { version = "0.7", features = ["io", "rt"] }
keyring     = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Le greffon publié dessine l'aperçu de la caméra dans un mode qui rend toute
# la fenêtre Android insensible au tactile pendant un scan — vérifié en
# testant deux boutons distincts, aucun ne répondait, seul le retour matériel
# fonctionnait. `vendor/tauri-plugin-barcode-scanner` porte le correctif d'une
# ligne (voir son commentaire) ; ce `[patch]` fait que chaque construction
# l'utilise, ici comme sur n'importe quelle autre machine ou en intégration
# continue — éditer le paquet en cache aurait marché une fois, ici, et nulle
# part ailleurs.
[patch.crates-io]
tauri-plugin-barcode-scanner = { path = "vendor/tauri-plugin-barcode-scanner" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"

[profile.dist]
inherits = "release"

[package]
name = "lochor-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Lochor local daemon — loopback HTTP/SSE API, sessions, projects, extensions."

[[bin]]
name = "lochor-daemon"
path = "src/main.rs"

[dependencies]
lochor-shared-types = { workspace = true }
lochor-sdk = { workspace = true }
lochor-config = { workspace = true }
lochor-storage = { workspace = true }
lochor-events = { workspace = true }
lochor-agent-runtime = { workspace = true }
lochor-provider-supervisor = { workspace = true }
lochor-extensions = { workspace = true }
lochor-mcp = { workspace = true }
lochor-travel = { workspace = true }
lochor-preview = { workspace = true }
lochor-auth = { workspace = true }
lochor-rules-runtime = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
igd-next = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }

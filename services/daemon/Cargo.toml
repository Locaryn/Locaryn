[package]
name = "locaryn-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Locaryn local daemon — loopback HTTP/SSE API, sessions, projects, extensions."

[[bin]]
name = "locaryn-daemon"
path = "src/main.rs"

[dependencies]
locaryn-shared-types = { workspace = true }
locaryn-sdk = { workspace = true }
locaryn-config = { workspace = true }
locaryn-media = { workspace = true }
locaryn-storage = { workspace = true }
locaryn-events = { workspace = true }
locaryn-agent-runtime = { workspace = true }
locaryn-provider-supervisor = { workspace = true }
locaryn-extensions = { workspace = true }
locaryn-mcp = { workspace = true }
locaryn-travel = { workspace = true }
locaryn-preview = { workspace = true }
locaryn-auth = { workspace = true }
locaryn-rules-runtime = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
igd-next = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }

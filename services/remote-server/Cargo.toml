[package]
name = "locaryn-remote-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Locaryn remote server — secured TLS gateway, auth, audit, provider proxying, enterprise module."

[[bin]]
name = "locaryn-remote-server"
path = "src/main.rs"

[dependencies]
# Pas de version épinglée : la brique entreprise n'est pas publiée, elle vit
# dans ce dépôt. L'épingle restait en arrière à chaque montée de version et ne
# se voyait que le jour où la résolution passait sous elle.
# La version accompagne le chemin, comme pour tous les autres membres : sans
# elle, c'est un joker, et `cargo-deny` le refuse à raison — un joker accepte
# n'importe quelle version publiée sous ce nom. Elle suit celle de l'espace de
# travail, qui monte d'un seul mouvement à chaque release.
locaryn-enterprise = { path = "enterprise", version = "0.4.0", optional = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

[features]
default = ["enterprise"]
enterprise = ["dep:locaryn-enterprise"]

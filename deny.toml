[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BUSL-1.1",
    # Licence historique de bzip2 : permissive, de type BSD. Arrive par
    # libbz2-rs-sys, que la lecture d'archives ZIP entraîne.
    "bzip2-1.0.6",
    # Le paquet de certificats racines de Mozilla (webpki-roots). Le CDLA
    # permissif autorise usage et redistribution sans contrepartie.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
# cargo-deny 0.18 a supprimé `vulnerability` — une vulnérabilité connue est
# désormais toujours refusée, et seule une entrée explicite dans `ignore` peut
# lever le blocage. Le laisser ici faisait échouer la CI sur la configuration
# elle-même, pas sur une dépendance.
yanked = "deny"
# RUSTSEC-2023-0071 — « Marvin Attack » : récupération de clé par canal
# temporel dans `rsa`. L'avis dit lui-même « No safe upgrade is available ».
#
# Le paquet arrive par la fonctionnalité `rsa` de russh, et retirer cette
# fonctionnalité le fait bien disparaître de l'arbre — au prix de
# l'authentification par clé RSA. Les clés `id_rsa` restent très répandues, en
# entreprise notamment : les couper silencieusement casserait des connexions
# qui fonctionnent aujourd'hui.
#
# Risque résiduel assumé : l'attaque exige de mesurer un grand nombre
# d'opérations privées chronométrées sur la machine de l'utilisateur. À
# réexaminer dès qu'un correctif amont existe, ou le jour où abandonner RSA
# devient acceptable pour les utilisateurs.
ignore = ["RUSTSEC-2023-0071"]
# Portée du contrôle des paquets non maintenus : `workspace` ne signale que
# nos dépendances directes. `all` remonterait des transitives sur lesquelles
# nous n'avons aucune prise, ce qui bloquerait la CI sans recours.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

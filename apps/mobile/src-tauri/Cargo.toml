[package]
name = "locaryn-mobile"
version.workspace = true
edition = "2021"
license.workspace = true

[lib]
# Android loads the application as a shared library, so the entry point lives
# in lib.rs rather than in a binary.
name = "locaryn_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
locaryn-config = { workspace = true }
locaryn-travel = { workspace = true }
locaryn-shared-types = { workspace = true }
# `custom-protocol` est requis pour embarquer le frontend (frontendDist) dans
# le binaire : sans lui, `tauri-codegen` passe en mode dev, n'embarque rien et
# l'application ne charge que le devUrl — écran blanc sur un vrai appareil.
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-deep-link = "2"
# Ouvre l'APK d'une nouvelle version avec le système : c'est Android qui
# installe, vérifie la signature et demande confirmation.
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# The camera only exists on a phone; on desktop the crate has no entry point,
# and the layout is developed on desktop.
# Lancer l'installateur d'Android demande de construire un `Intent` : le
# greffon `opener` ne sait ouvrir qu'une adresse, pas un fichier local, et le
# passage par un navigateur n'est pas une mise à jour, c'est un détour.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# `tao` porte déjà la machine virtuelle et l'activité — celles que sa couche
# Android enregistre au démarrage. `ndk-context` n'est pas alimenté ici : il
# panique, et le processus meurt avec lui.
tao = "0.35"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

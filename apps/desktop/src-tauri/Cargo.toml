[package]
name = "locaryn-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Locaryn desktop app (Tauri v2 shell)."

[lib]
name = "locaryn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "locaryn-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
locaryn-shared-types = { workspace = true }
locaryn-agent-runtime = { workspace = true }
locaryn-core-bridge = { workspace = true }
async-trait = { workspace = true }
locaryn-preview = { workspace = true }
locaryn-events = { workspace = true }
locaryn-storage = { workspace = true }
locaryn-config = { workspace = true }
locaryn-llmfit = { workspace = true }
locaryn-hook-runtime = { workspace = true }
locaryn-extensions = { workspace = true }
locaryn-command-runtime = { workspace = true }
locaryn-provider-supervisor = { workspace = true }
locaryn-auth = { workspace = true, features = ["system-keychain"] }
locaryn-mcp = { workspace = true }
locaryn-travel = { workspace = true }
locaryn-sdk = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true, features = ["std"] }
tokio-util = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tauri-plugin-dialog = "2"
# Les bannières du système, pour ce qui se termine quand la fenêtre est
# réduite. Ce greffon tire `notify-rust`, dont la 4.18 exige rustc 1.89 alors
# que le dépôt épingle 1.88 : le verrou le retient en 4.11, et la résolution
# échouera bruyamment si quelqu'un le relâche sans monter la chaîne d'outils.
tauri-plugin-notification = "2"
url = "2"
base64 = "0.22"
# Disk capacity reporting for the storage settings (free space per volume).
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }

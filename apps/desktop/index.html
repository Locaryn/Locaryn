<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locaryn</title>
    <style>
      /*
        Peint avant tout le reste, sans attendre le CSS de l'application ni
        React : sans ça, la fenêtre s'ouvrait en blanc le temps que la feuille
        de style arrive, puis basculait d'un coup vers le fond sombre — un
        flash visible à chaque lancement.

        Ceci ne couvre que le document. Avant lui, la fenêtre native et la vue
        web ont leur propre fond, blanc par défaut, et aucune feuille de style
        ne les atteint : c'est « backgroundColor » dans
        apps/desktop/src-tauri/tauri.conf.json qui s'en charge.

        La couleur reprend --bg de packages-ui/tokens/tokens.css ; les trois
        doivent rester d'accord.
      */
      html,
      body {
        background: #17191a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

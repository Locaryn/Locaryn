[package]
name = "locaryn-plugin-video-gen"
version = "1.0.0"
edition = "2021"
description = "Official Locaryn Extension: Text-to-Video & Image-to-Video Generation (AnimateDiff, CogVideoX)"
license = "Apache-2.0"
authors = ["Locaryn Team"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"

[package]
name = "locaryn-plugin-image-gen"
version = "1.0.0"
edition = "2021"
description = "Official Locaryn Extension: Text-to-Image Generation (Flux, Stable Diffusion, SDXL, Z-Image)"
license = "Apache-2.0"
authors = ["Locaryn Team"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"
async-trait = "0.1"

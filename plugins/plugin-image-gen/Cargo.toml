[package]
name = "locaryn-plugin-image-gen"
version = "1.4.2"
edition = "2021"
description = "Official Locaryn Extension: Text-to-Image Generation (Flux, Stable Diffusion, SDXL, Z-Image)"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-image-gen-mcp"
path = "src/bin/image_gen_mcp.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
walkdir = "2"

[workspace]
